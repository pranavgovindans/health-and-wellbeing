<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Dashboard</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    background:#f4f6fb;
    font-family:Segoe UI,Arial,sans-serif;
    margin:0;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

h1{
    text-align:center;
    color:#5b5de6;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 12px rgba(0,0,0,.1);
}

.card h2{
    color:#555;
}

.value{
    font-size:35px;
    color:#5b5de6;
    font-weight:bold;
}

canvas{
    margin-top:40px;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 5px 12px rgba(0,0,0,.1);
}

button{
    margin-top:30px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    background:#5b5de6;
    color:white;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h1>❤️ Health Dashboard</h1>

<div class="cards">

<div class="card">
<h2>Heart Rate</h2>
<div class="value" id="heartRate">72 bpm</div>
</div>

<div class="card">
<h2>Respiration</h2>
<div class="value" id="respRate">16 rpm</div>
</div>

<div class="card">
<h2>Body Temperature</h2>
<div class="value" id="temp">36.8°C</div>
</div>

<div class="card">
<h2>Blood Oxygen</h2>
<div class="value" id="spo2">98%</div>
</div>

</div>

<canvas id="heartChart" height="120"></canvas>

<center>
<button onclick="window.location.href='health-default.html'">
⬅ Back
</button>
</center>

</div>

<script>
const canvas=document.getElementById("heartChart");
const ctx=canvas.getContext("2d");

canvas.width=900;

let points=[];

for(let i=0;i<90;i++){
    points.push(60);
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();

    ctx.strokeStyle="red";

    ctx.lineWidth=2;

    for(let i=0;i<points.length;i++){

        let x=i*10;
        let y=points[i];

        if(i==0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);
    }

    ctx.stroke();
}

setInterval(function(){

    points.shift();

    let value=60+Math.random()*10;

    if(Math.random()>0.90){
        value=20;
    }

    points.push(value);

    draw();

    document.getElementById("heartRate").innerHTML=
    (65+Math.floor(Math.random()*15))+" bpm";

    document.getElementById("respRate").innerHTML=
    (12+Math.floor(Math.random()*6))+" rpm";

    document.getElementById("temp").innerHTML=
    (36+Math.random()).toFixed(1)+"°C";

    document.getElementById("spo2").innerHTML=
    (96+Math.floor(Math.random()*4))+"%";

},500);
</script>

</body>
</html>
