<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="profile-container">

    <h1>Health Profile</h1>
    <p>Please complete your personal health information.</p>

    <div class="photo-section">
        <img src="images/default-profile.png" id="profilePreview" class="profile-photo">
        <input type="file" id="profileImage">
    </div>

    <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name">
    </div>

    <div class="form-group">
        <label>Gender</label>

       <select id="gender">
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
    </div>

    <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="dob">
    </div>

    <div class="form-group">
        <label>Height (cm)</label>
        <input type="number" id="height">
    </div>

    <div class="form-group">
        <label>Weight (kg)</label>
       <input type="number" id="weight">
    </div>

    <div class="form-group">
        <label>Blood Group</label>

       <select id="bloodGroup">
            <option>Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>
    </div>

    <div class="form-group">
        <label>Country</label>
        <input type="text" id="country">
    </div>

    <div class="form-group">
        <label>State</label>
       <input type="text" id="state">
    </div>

    <div class="form-group">
        <label>District</label>
       <input type="text" id="district">
    </div>

    <div class="form-group">
        <label>Emergency Contact Name</label>
        <input type="text" id="emergencyName">
    </div>

    <div class="form-group">
        <label>Emergency Contact Number</label>
       <input type="tel" id="emergencyNumber">
    </div>

    <div class="form-group">
        <label>Known Allergies</label>
       <textarea id="allergies"></textarea>
    </div>

    <div class="form-group">
        <label>Existing Medical Conditions</label>
       <textarea id="medicalConditions"></textarea>
    </div>

    <button class="primary-btn" onclick="saveProfile()">
    Save & Continue
</button>

</div>

<script src="js/script.js"></script>

</body>
</html>
